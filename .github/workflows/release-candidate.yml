name: Companion Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests companion-projects

      - name: Run tests with coverage
        run: python -m pytest --cov=tools --cov-report=term-missing -q

      - name: Run project-owned companion tests
        run: python companion-projects/run_tests.py

      - name: Validate companion project structure
        run: python tools/companion_projects_check.py --root .

      - name: Show expected companion tag
        run: python tools/tag_preflight.py --root .

      - name: Run consolidated repository health gate
        run: python tools/repo_health.py --root .

      - name: Check generated policy status
        run: python tools/policy_status.py --root . --output docs/POLICY_STATUS.md --check

      - name: Check release readiness report
        run: python tools/release_readiness.py --root . --output docs/RELEASE_READINESS.md --check

      - name: Generate public resource manifest
        run: python tools/resource_manifest.py --root . --output PUBLIC_RESOURCE_MANIFEST.json

      - name: Verify public resource manifest
        run: python tools/manifest_verify.py --root . PUBLIC_RESOURCE_MANIFEST.json

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-release-candidate-${{ github.sha }}
          path: |
            PUBLIC_RESOURCE_MANIFEST.json
            docs/POLICY_STATUS.md
            docs/RELEASE_READINESS.md
            docs/RELEASE_SNAPSHOT.md
            COMPANION_RELEASE.json
            CITATION.cff
          if-no-files-found: error
          retention-days: 30
