name: Companion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests with coverage report
        run: python -m pytest --cov=tools --cov-report=term-missing -q
      - name: Validate immutable GitHub Actions references
        run: python tools/action_pinning.py --root .
      - name: Validate contributor and CI environment consistency
        run: python tools/dev_environment.py --root .
      - name: Check synthetic CSV structure
        run: python tools/csv_quality.py datasets/*.csv
      - name: Validate dataset contracts
        run: python tools/dataset_contracts.py schemas/dataset_contracts.json datasets
      - name: Check generated data dictionary freshness
        run: python tools/data_dictionary.py schemas/dataset_contracts.json --output docs/DATA_DICTIONARY.md --check
      - name: Validate JSON metadata
        run: python tools/json_metadata.py COMPANION_RELEASE.json schemas/dataset_contracts.json
      - name: Validate release version consistency
        run: python tools/release_consistency.py --root .
      - name: Validate Parts 1-200 learning index integrity
        run: python tools/learning_index_check.py --root .
      - name: Check documentation TOC freshness
        run: python tools/docs_toc.py --docs-dir docs --output docs/TOC.md --check
      - name: Check synthetic data for sensitive-looking values
        run: python tools/synthetic_safety.py datasets/*.csv
      - name: Check documentation accessibility basics
        run: python tools/doc_accessibility.py README.md docs resources schemas exercises examples
      - name: Check relative Markdown links
        run: python tools/markdown_links.py README.md docs resources schemas exercises examples ERRATA.md ROADMAP.md CHANGELOG.md what_changed.md
      - name: Check official Gumroad storefront presence
        run: python tools/gumroad_presence.py --root .
      - name: Generate public resource manifest as a smoke test
        run: python tools/resource_manifest.py --root . --output /tmp/public-resource-manifest.json
      - name: Run consolidated repository health check
        run: python tools/repo_health.py --root .
