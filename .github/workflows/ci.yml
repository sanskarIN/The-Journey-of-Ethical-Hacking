name: Companion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check synthetic CSV structure
        run: python tools/csv_quality.py datasets/*.csv
      - name: Validate dataset contracts
        run: python tools/dataset_contracts.py schemas/dataset_contracts.json datasets
      - name: Check documentation accessibility basics
        run: python tools/doc_accessibility.py README.md docs resources schemas
      - name: Check relative Markdown links
        run: python tools/markdown_links.py README.md docs resources schemas ERRATA.md ROADMAP.md CHANGELOG.md what_changed.md
