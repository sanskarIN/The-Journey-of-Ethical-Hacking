name: Companion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pytest-cov
      - name: Run unit tests with coverage report
        run: python -m pytest --cov=tools --cov-report=term-missing -q
      - name: Check synthetic CSV structure
        run: python tools/csv_quality.py datasets/*.csv
      - name: Validate dataset contracts
        run: python tools/dataset_contracts.py schemas/dataset_contracts.json datasets
      - name: Check documentation accessibility basics
        run: python tools/doc_accessibility.py README.md docs resources schemas exercises
      - name: Check relative Markdown links
        run: python tools/markdown_links.py README.md docs resources schemas exercises ERRATA.md ROADMAP.md CHANGELOG.md what_changed.md
