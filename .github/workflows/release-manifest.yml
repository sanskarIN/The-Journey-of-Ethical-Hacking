name: Companion Release Manifest

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests companion-projects

      - name: Run tests with coverage
        run: python -m pytest --cov=tools --cov-report=term-missing -q

      - name: Run project-owned companion tests
        run: python companion-projects/run_tests.py

      - name: Validate companion project structure
        run: python tools/companion_projects_check.py --root .

      - name: Show expected companion tag
        if: ${{ !startsWith(github.ref, 'refs/tags/companion-v') }}
        run: python tools/tag_preflight.py --root .

      - name: Validate pushed companion tag
        if: ${{ startsWith(github.ref, 'refs/tags/companion-v') }}
        run: python tools/tag_preflight.py --root . --tag "${GITHUB_REF_NAME}"

      - name: Run repository health checks
        run: python tools/repo_health.py --root .

      - name: Validate release version consistency
        run: python tools/release_consistency.py --root .

      - name: Generate public resource manifest
        run: python tools/resource_manifest.py --root . --output PUBLIC_RESOURCE_MANIFEST.json

      - name: Verify public resource manifest
        run: python tools/manifest_verify.py --root . PUBLIC_RESOURCE_MANIFEST.json

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-resource-manifest-${{ github.ref_name }}
          path: PUBLIC_RESOURCE_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
